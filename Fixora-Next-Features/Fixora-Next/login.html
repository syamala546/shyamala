<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — Fixora</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

  <div class="auth-container">

    <a href="index.html" class="logo">
      FIX<span>ORA</span>
    </a>

    <div class="auth-card">

      <div class="auth-icon">🔐</div>

      <h1>Welcome Back</h1>

      <p>Login to manage your Fixora bookings.</p>

      <form id="loginForm">

        <label for="loginEmail">Email Address</label>

        <input
          id="loginEmail"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="loginPassword">Password</label>

        <input
          id="loginPassword"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <div class="password-options">

          <label class="remember">
            <input
              type="checkbox"
              id="rememberMe"
            >
            Remember me
          </label>

          <button
            type="button"
            class="forgot-btn"
            onclick="alert('Password reset will be available soon.')"
          >
            Forgot Password?
          </button>

        </div>

        <button
          class="btn full"
          type="submit"
        >
          Login
        </button>

      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <button
        type="button"
        class="social-login"
        onclick="alert('Google Login will be connected soon.')"
      >
        <span>G</span>
        Continue with Google
      </button>

      <p class="auth-bottom">
        Don't have an account?
        <a href="signup.html">Create an Account</a>
      </p>

      <a
        class="back-home"
        href="index.html"
      >
        ← Back to Fixora
      </a>

    </div>

    <p class="secure-note">
      🔒 Your account is protected by Fixora security.
    </p>

  </div>

  <script src="script.js"></script>

</body>
</html>
