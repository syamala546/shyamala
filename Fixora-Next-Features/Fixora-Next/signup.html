<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account — Fixora</title>

  <link rel="stylesheet" href="styles.css">

</head>


<body class="auth-page">

  <div class="auth-container">

    <!-- LOGO -->

    <a
      href="index.html"
      class="logo"
    >
      FIX<span>ORA</span>
    </a>


    <!-- SIGNUP CARD -->

    <div class="auth-card">

      <div class="auth-icon">
        ✨
      </div>


      <h1>
        Create Account
      </h1>


      <p>
        Join Fixora and manage all your home services.
      </p>


      <form id="signupForm">

        <!-- NAME -->

        <label for="signupName">
          Full Name
        </label>

        <input
          id="signupName"
          type="text"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >


        <!-- EMAIL -->

        <label for="signupEmail">
          Email Address
        </label>

        <input
          id="signupEmail"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >


        <!-- PHONE -->

        <label for="signupPhone">
          Phone Number
        </label>

        <input
          id="signupPhone"
          type="tel"
          placeholder="Enter your 10 digit mobile number"
          autocomplete="tel"
          minlength="10"
          maxlength="10"
          required
        >


        <!-- PASSWORD -->

        <label for="signupPassword">
          Password
        </label>

        <input
          id="signupPassword"
          type="password"
          placeholder="Create a password"
          autocomplete="new-password"
          minlength="6"
          required
        >


        <!-- CONFIRM PASSWORD -->

        <label for="signupConfirm">
          Confirm Password
        </label>

        <input
          id="signupConfirm"
          type="password"
          placeholder="Confirm your password"
          autocomplete="new-password"
          minlength="6"
          required
        >


        <!-- TERMS -->

        <label class="terms-check">

          <input
            type="checkbox"
            id="termsCheck"
            required
          >

          <span>
            I agree to Fixora's
            <a href="#" onclick="return false;">
              Terms & Conditions
            </a>
          </span>

        </label>


        <!-- CREATE ACCOUNT -->

        <button
          class="btn full"
          type="submit"
        >
          Create Account
        </button>

      </form>


      <!-- LOGIN -->

      <p class="auth-bottom">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </p>


      <!-- BACK -->

      <a
        class="back-home"
        href="index.html"
      >
        ← Back to Fixora
      </a>

    </div>


    <p class="secure-note">
      🔒 Your information is stored securely.
    </p>

  </div>


  <script src="script.js"></script>

</body>

</html>
